<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Finanzas Familiares</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b1120;overflow:hidden}#app-frame{width:100%;height:100%;border:0;display:block}#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1120;color:#93c5fd;font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:24px;box-sizing:border-box}
</style>
</head>
<body>
<div id="boot">Cargando finanzas...</div>
<iframe id="app-frame" title="Finanzas Familiares" style="display:none"></iframe>
<script>
(async function () {
  const boot = document.getElementById('boot');
  const frame = document.getElementById('app-frame');
  try {
    const response = await fetch('./app-base.html?v=20260903-paylinks-v2', { cache: 'no-store' });
    if (!response.ok) throw new Error('No se pudo cargar la app base');
    let html = await response.text();

    const replaceRequired = (from, to, label) => {
      if (!html.includes(from)) throw new Error('No se encontró el bloque: ' + label);
      html = html.replace(from, to);
    };

    replaceRequired(
      "image: '', imageUrl: '', imageAsIcon: false, imageColor: '#ffffff', isExternal: false, externalPerson: ''",
      "image: '', imageUrl: '', imageAsIcon: false, imageColor: '#ffffff', isExternal: false, externalPerson: '', paymentUrl: ''",
      'estado inicial paymentUrl'
    );

    replaceRequired(
      "image: '', imageUrl: '', imageAsIcon: false, imageColor: '#ffffff', isExternal: false, externalPerson: selectedExternalPerson });",
      "image: '', imageUrl: '', imageAsIcon: false, imageColor: '#ffffff', isExternal: false, externalPerson: selectedExternalPerson, paymentUrl: '' });",
      'nuevo gasto paymentUrl'
    );

    replaceRequired(
      "setFormData({ ...tx, amount: tx.amount, currentInstallment: currentQuota, imageUrl: tx.imageUrl || '', imageAsIcon: tx.imageAsIcon || false, imageColor: tx.imageColor || '#ffffff' });",
      "setFormData({ ...tx, amount: tx.amount, currentInstallment: currentQuota, imageUrl: tx.imageUrl || '', imageAsIcon: tx.imageAsIcon || false, imageColor: tx.imageColor || '#ffffff', paymentUrl: tx.paymentUrl || '' });",
      'editar gasto paymentUrl'
    );

    replaceRequired(
      "React.createElement(\"input\", { type: \"text\", value: formData.description, onChange: e => setFormData({ ...formData, description: e.target.value }), className: \"w-full bg-transparent px-4 py-3 md:py-4 text-white outline-none placeholder:text-blue-300 font-bold md:text-lg\", placeholder: \"Descripci\\u00F3n (Ej: Supermercado)\" })),\n                        React.createElement(\"div\", { className: \"grid grid-cols-2 gap-4\" },",
      "React.createElement(\"input\", { type: \"text\", value: formData.description, onChange: e => setFormData({ ...formData, description: e.target.value }), className: \"w-full bg-transparent px-4 py-3 md:py-4 text-white outline-none placeholder:text-blue-300 font-bold md:text-lg\", placeholder: \"Descripci\\u00F3n (Ej: Supermercado)\" })),\n                        formData.type === 'expense' && React.createElement(\"div\", { className: \"neo-inset p-2\" },\n                            React.createElement(\"input\", { type: \"text\", value: formData.paymentUrl || '', onChange: e => setFormData({ ...formData, paymentUrl: e.target.value }), className: \"w-full bg-transparent px-4 py-3 text-white outline-none placeholder:text-blue-300 text-sm\", placeholder: \"Enlace para pagar (opcional)\" })),\n                        React.createElement(\"div\", { className: \"grid grid-cols-2 gap-4\" },",
      'campo enlace de pago'
    );

    replaceRequired(
      "React.createElement(\"h4\", { className: `font-bold truncate pr-2 text-sm md:text-lg ${tx.isPaidForMonth ? 'line-through text-emerald-200' : 'text-white'}` }, tx.description),",
      "React.createElement(\"div\", { className: \"flex items-center gap-2 min-w-0 pr-2\" },\n                            React.createElement(\"h4\", { className: `font-bold truncate text-sm md:text-lg ${tx.isPaidForMonth ? 'line-through text-emerald-200' : 'text-white'}` }, tx.description),\n                            tx.type === 'expense' && tx.paymentUrl && React.createElement(\"a\", { href: /^(https?:)?\\/\\//i.test(tx.paymentUrl) ? tx.paymentUrl : ('https://' + tx.paymentUrl), target: \"_blank\", rel: \"noopener noreferrer\", onClick: e => e.stopPropagation(), className: \"shrink-0 px-2.5 py-1 rounded-full bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 text-[10px] md:text-xs font-extrabold uppercase tracking-wide hover:bg-emerald-500/30 transition-colors\", title: \"Abrir enlace de pago\" }, \"Pagar\")),",
      'botón pagar junto al nombre'
    );

    frame.addEventListener('load', function () {
      boot.style.display = 'none';
      frame.style.display = 'block';
    }, { once: true });
    frame.srcdoc = html;
  } catch (err) {
    console.error(err);
    boot.innerHTML = '<div><div style="color:white;font-size:18px;margin-bottom:8px">No se pudo iniciar Finanzas.</div><div style="font-size:12px;text-transform:none;letter-spacing:0;color:#94a3b8">Recargá la página. Si persiste, revisá la consola.</div></div>';
  }
})();
</script>
</body>
</html>
